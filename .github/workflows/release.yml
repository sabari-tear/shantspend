name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Validate keystore
        run: |
          keytool -list -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keystore release.jks \
            || { echo "::error::release.jks is not a valid keystore - the KEYSTORE_BASE64 secret is likely corrupted. Regenerate it and re-run 'gh secret set KEYSTORE_BASE64 --body \$b64' (see README)."; exit 1; }

      - name: Read versionName
        id: version
        run: |
          VN=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "(.*)".*/\1/')
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      - name: Clean up keystore
        if: always()
        run: rm -f release.jks

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## Commits since $PREV_TAG"
              git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)"
            else
              echo "## Commits"
              git log --pretty=format:"- %s (%h)"
            fi
            echo ""
          } > changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.versionName }}-build${{ github.run_number }}
          name: v${{ steps.version.outputs.versionName }}-build${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          body_path: changelog.md
          generate_release_notes: true
